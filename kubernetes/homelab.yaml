apiVersion: v1
kind: Namespace
metadata:
  name: media
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jellyfin-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      nodeSelector:
        kubernetes.io/hostname: kilo
      containers:
        - name: jellyfin
          image: docker.io/jellyfin/jellyfin:10.11.11
          ports:
            - name: http
              containerPort: 8096
          volumeMounts:
            - name: config
              mountPath: /config
            - name: cache
              mountPath: /cache
            - name: jukebox
              mountPath: /Jukebox
              readOnly: true
            - name: movies
              mountPath: /Movies
              readOnly: true
            - name: tv
              mountPath: /TV
              readOnly: true
            - name: sports
              mountPath: /Sports
              readOnly: true
            - name: dri
              mountPath: /dev/dri
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 4Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: jellyfin-config
        - name: cache
          emptyDir: {}
        - name: jukebox
          hostPath:
            path: /mnt/illmatic/Jukebox
            type: Directory
        - name: movies
          hostPath:
            path: /mnt/illmatic/Movies
            type: Directory
        - name: tv
          hostPath:
            path: /mnt/illmatic/TV
            type: Directory
        - name: sports
          hostPath:
            path: /mnt/illmatic/Sports
            type: Directory
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin
  namespace: media
spec:
  type: LoadBalancer
  selector:
    app: jellyfin
  ports:
    - name: http
      port: 8096
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: navidrome-data
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: navidrome
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: navidrome
  template:
    metadata:
      labels:
        app: navidrome
    spec:
      nodeSelector:
        kubernetes.io/hostname: kilo
      containers:
        - name: navidrome
          image: docker.io/deluan/navidrome:0.63.2
          env:
            - name: ND_MUSICFOLDER
              value: /Jukebox
            - name: ND_DATAFOLDER
              value: /data
            - name: ND_ENABLEINSIGHTSCOLLECTOR
              value: "false"
          ports:
            - name: http
              containerPort: 4533
          volumeMounts:
            - name: data
              mountPath: /data
            - name: music
              mountPath: /Jukebox
              readOnly: true
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: navidrome-data
        - name: music
          hostPath:
            path: /mnt/illmatic/Jukebox
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: navidrome
  namespace: media
spec:
  type: LoadBalancer
  selector:
    app: navidrome
  ports:
    - name: http
      port: 4533
      targetPort: http
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sabnzbd-config
  namespace: media
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sabnzbd
  namespace: media
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: sabnzbd
  template:
    metadata:
      labels:
        app: sabnzbd
    spec:
      containers:
        - name: sabnzbd
          image: lscr.io/linuxserver/sabnzbd:4.5.5
          env:
            - name: PUID
              value: "1000"
            - name: PGID
              value: "100"
            - name: TZ
              value: America/New_York
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /config
            - name: downloads
              mountPath: /downloads
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: sabnzbd-config
        - name: downloads
          hostPath:
            path: /mnt/illmatic/Downloads
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: sabnzbd
  namespace: media
spec:
  type: LoadBalancer
  selector:
    app: sabnzbd
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: v1
kind: Namespace
metadata:
  name: web
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-homepage
  namespace: web
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="utf-8">
      <meta name="viewport" content="width=device-width, initial-scale=1">
      <title>Homelab</title>
      <style>
        body { font-family: system-ui, sans-serif; background: #1e1e2e; color: #cdd6f4;
               display: flex; justify-content: center; padding: 4rem 1rem; margin: 0; }
        main { width: 100%; max-width: 32rem; }
        h1 { font-size: 1.5rem; margin-bottom: 1.5rem; }
        a { display: block; background: #313244; color: #89b4fa; text-decoration: none;
            padding: 1rem 1.25rem; border-radius: 0.5rem; margin-bottom: 0.75rem; }
        a:hover { background: #45475a; }
        a span { float: right; color: #6c7086; }
      </style>
    </head>
    <body>
      <main>
        <h1>Homelab</h1>
        <a href="http://kilo.local:8096">Jellyfin <span>media</span></a>
        <a href="http://kilo.local:4533">Navidrome <span>music</span></a>
        <a href="http://kilo.local:8080">SABnzbd <span>usenet</span></a>
        <a href="http://kilo.local:8081/admin">Pi-hole <span>dns</span></a>
      </main>
    </body>
    </html>
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: docker.io/library/nginx:1.29-alpine
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: homepage
              mountPath: /usr/share/nginx/html
              readOnly: true
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: homepage
          configMap:
            name: nginx-homepage
---
apiVersion: v1
kind: Service
metadata:
  name: nginx
  namespace: web
spec:
  type: LoadBalancer
  selector:
    app: nginx
  ports:
    - name: http
      # Port 80 on the nodes is already claimed by Traefik's ServiceLB.
      port: 8082
      targetPort: http
---
apiVersion: v1
kind: Namespace
metadata:
  name: network
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pihole-data
  namespace: network
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pihole
  namespace: network
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: pihole
  template:
    metadata:
      labels:
        app: pihole
    spec:
      nodeSelector:
        kubernetes.io/hostname: kilo
      containers:
        - name: pihole
          image: docker.io/pihole/pihole:2025.06.2
          env:
            - name: TZ
              value: America/New_York
            - name: FTLCONF_dns_listeningMode
              value: all
            # Fail closed until network/pihole-admin has been provisioned.
            - name: FTLCONF_webserver_api_password
              valueFrom:
                secretKeyRef:
                  name: pihole-admin
                  key: password
                  optional: false
          ports:
            - name: dns-tcp
              containerPort: 53
              protocol: TCP
            - name: dns-udp
              containerPort: 53
              protocol: UDP
            - name: http
              containerPort: 80
          securityContext:
            capabilities:
              add: [NET_ADMIN]
          volumeMounts:
            - name: data
              mountPath: /etc/pihole
          readinessProbe:
            httpGet:
              path: /admin/
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pihole-data
---
apiVersion: v1
kind: Service
metadata:
  name: pihole
  namespace: network
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: pihole
  ports:
    - name: dns-tcp
      port: 53
      targetPort: dns-tcp
      protocol: TCP
    - name: dns-udp
      port: 53
      targetPort: dns-udp
      protocol: UDP
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
